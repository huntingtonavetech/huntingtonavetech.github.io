<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huntington Avenue Technologies LLC</title>

  <!-- Roboto -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --background: #0d1117;
      --surface: #161b22;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --border: #30363d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: "Roboto", sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 28px 40px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
    }

    .hero {
      max-width: 800px;
      text-align: center;
    }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    .tagline {
      margin: 0 auto;
      max-width: 650px;
      color: var(--muted);
      font-size: 1.25rem;
      line-height: 1.7;
      font-weight: 300;
    }

    .accent {
      color: var(--accent);
    }

    footer {
      padding: 24px 40px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }

    @media (max-width: 600px) {
      header {
        padding: 24px;
      }

      main {
        padding: 60px 20px;
      }

      footer {
        padding: 20px;
      }
    }
  </style>

</head>

<body>


  <main>
    <section class="hero">
      <h1>
        Building <span class="accent">intelligent perception</span> for the real world.
      </h1>


  <p class="tagline">
    Huntington Avenue Technologies develops AI and perception systems that help machines understand, navigate, and interact with the world around them.
  </p>
</section>


  </main>

  <footer>
    &copy; 2026 Huntington Avenue Technologies LLC
  </footer>
</body>
</html>
